<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第 4 週 單字練習 — Aladdin 英文繪本課</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
    background: linear-gradient(135deg, #F3E8FF 0%, #E9D5FF 50%, #D8B4FE 100%);
    color: #2D1654;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== Name Screen ===== */
  #nameScreen {
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(135deg, #F3E8FF 0%, #E9D5FF 50%, #D8B4FE 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .ns-box {
    background: white; border: 5px solid #C084FC; border-radius: 28px;
    padding: 40px 32px; text-align: center; max-width: 420px; width: 90%;
    box-shadow: 0 8px 0 #7C3AED, 0 16px 40px rgba(0,0,0,0.12);
  }
  .ns-box .icon { font-size: 72px; margin-bottom: 12px; }
  .ns-box h1 { font-size: 28px; color: #5B21B6; margin-bottom: 4px; }
  .ns-box p { font-size: 16px; color: #6D28D9; margin-bottom: 24px; }
  #nameInput {
    width: 100%; padding: 14px 18px; font-size: 22px;
    border: 3px solid #C084FC; border-radius: 14px;
    background: #FAF5FF; color: #2D1654; outline: none;
    text-align: center; font-family: inherit; margin-bottom: 14px;
  }
  #nameInput:focus { border-color: #7C3AED; }
  .ns-start {
    width: 100%; padding: 16px; font-size: 22px; font-weight: bold;
    background: #7C3AED; color: white; border: none; border-radius: 14px;
    cursor: pointer; font-family: inherit; box-shadow: 0 5px 0 #4C1D95;
    margin-bottom: 10px;
  }
  .ns-start:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #4C1D95; }
  .ns-start:active { transform: translateY(3px); box-shadow: 0 2px 0 #4C1D95; }
  .ns-lb {
    width: 100%; padding: 13px; font-size: 18px;
    background: white; color: #7C3AED; border: 3px solid #7C3AED;
    border-radius: 14px; cursor: pointer; font-family: inherit;
  }
  .ns-lb:hover { background: #FAF5FF; }

  /* ===== Header ===== */
  header { text-align: center; padding: 20px 16px 10px; }
  header h1 { font-size: 36px; color: #5B21B6; text-shadow: 2px 2px 0 rgba(255,255,255,0.6); margin-bottom: 4px; }
  .player-bar { font-size: 16px; color: #6D28D9; margin-bottom: 4px; }
  .player-bar span { font-weight: bold; color: #5B21B6; }
  header .sub { font-size: 16px; color: #6D28D9; font-weight: 500; line-height: 1.6; }

  /* ===== Level Selector ===== */
  .level-bar { display: flex; justify-content: center; gap: 14px; padding: 12px 16px 4px; flex-wrap: wrap; }
  .level-btn {
    font-family: inherit; font-size: 20px; font-weight: bold;
    padding: 10px 30px; border: 4px solid #7C3AED; border-radius: 50px;
    background: white; color: #7C3AED; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 4px 0 #4C1D95;
  }
  .level-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #4C1D95; }
  .level-btn.active { background: #7C3AED; color: white; transform: translateY(2px); box-shadow: 0 2px 0 #4C1D95; }
  .level-label { text-align: center; font-size: 14px; color: #6D28D9; padding: 3px 0 10px; }

  /* ===== Nav ===== */
  nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px 14px; }
  nav button {
    font-family: inherit; font-size: 18px; font-weight: bold;
    padding: 12px 22px; border: 3px solid #7C3AED; border-radius: 50px;
    background: white; color: #7C3AED; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 3px 0 #4C1D95;
  }
  nav button:hover { transform: translateY(-2px); box-shadow: 0 5px 0 #4C1D95; }
  nav button.active { background: #7C3AED; color: white; transform: translateY(2px); box-shadow: 0 1px 0 #4C1D95; }
  nav button.lb-btn { border-color: #B45309; color: #B45309; box-shadow: 0 3px 0 #78350F; }
  nav button.lb-btn:hover { box-shadow: 0 5px 0 #78350F; }
  nav button.lb-btn.active { background: #B45309; color: white; box-shadow: 0 1px 0 #78350F; }

  main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 48px; min-height: 60vh; }
  .panel-title { text-align: center; font-size: 26px; color: #2D1654; margin: 8px 0 24px; }
  .panel-title small { display: block; font-size: 16px; color: #6D28D9; margin-top: 4px; font-weight: normal; }

  /* ===== Timer ===== */
  .game-timer { text-align: center; font-size: 18px; color: #6D28D9; margin-bottom: 14px; }
  .game-timer span { font-weight: bold; color: #5B21B6; }

  /* ===== Flashcards ===== */
  .fc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 1000px) { .fc-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 650px)  { .fc-grid { grid-template-columns: repeat(2, 1fr); } }
  .fc-card {
    background: white; border: 5px solid #C084FC; border-radius: 24px;
    padding: 18px 14px; text-align: center;
    box-shadow: 0 6px 0 #A855F7, 0 10px 25px rgba(0,0,0,0.1);
    cursor: pointer; transition: transform 0.2s;
    min-height: 220px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .fc-card:hover { transform: translateY(-4px); }
  .fc-card.flipped { background: #FAF5FF; border-color: #7C3AED; }
  /* Chinese shown on front as the "hint" label */
  .fc-zh-front { font-size: 28px; font-weight: bold; color: #C084FC; margin: 8px 0 4px; }
  .fc-card.flipped .fc-zh-front { color: #7C3AED; }
  .fc-word { font-size: 32px; font-weight: bold; color: #5B21B6; margin: 4px 0; letter-spacing: 1px; }
  .fc-hint { font-size: 14px; color: #A78BFA; margin-bottom: 8px; min-height: 18px; }
  .fc-speak {
    background: #7C3AED; color: white; border: none; border-radius: 50px;
    padding: 7px 16px; font-size: 16px; font-weight: bold; cursor: pointer;
    font-family: inherit; box-shadow: 0 3px 0 #4C1D95;
  }
  .fc-speak:hover { transform: translateY(-1px); }

  /* ===== Memory Match ===== */
  .mm-status { text-align: center; font-size: 20px; margin-bottom: 14px; color: #2D1654; }
  .mm-status .badge { display: inline-block; background: #7C3AED; color: white; padding: 3px 16px; border-radius: 50px; font-weight: bold; margin: 0 6px; }
  .mm-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; max-width: 900px; margin: 0 auto; }
  @media (max-width: 700px) { .mm-grid { grid-template-columns: repeat(4, 1fr); } }
  .mm-card {
    aspect-ratio: 1; background: #7C3AED; border-radius: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: white; box-shadow: 0 5px 0 #4C1D95;
    transition: all 0.3s; user-select: none; overflow: hidden;
  }
  .mm-card::before { content: "?"; font-size: 60px; font-family: Arial Black, sans-serif; }
  .mm-card.flipped, .mm-card.matched { background: white; color: #5B21B6; border: 4px solid #C084FC; }
  .mm-card.flipped::before, .mm-card.matched::before { display: none; }
  .mm-card.matched { background: #D1FAE5; border-color: #34D399; cursor: default; transform: scale(0.96); }
  .mm-card .mm-content { display: none; text-align: center; padding: 6px; }
  .mm-card.flipped .mm-content, .mm-card.matched .mm-content { display: flex; align-items: center; justify-content: center; height: 100%; }
  .mm-content .wd { font-size: 15px; font-weight: bold; color: #5B21B6; line-height: 1.3; }
  .mm-content .z { font-size: 18px; font-weight: bold; color: #7C3AED; line-height: 1.3; }

  /* ===== Listen and Choose ===== */
  .ls-prompt { text-align: center; margin-bottom: 20px; }
  .ls-play-btn {
    font-size: 26px; background: #7C3AED; color: white; border: none;
    border-radius: 50px; padding: 16px 44px; cursor: pointer;
    font-family: inherit; font-weight: bold; box-shadow: 0 5px 0 #4C1D95;
  }
  .ls-play-btn:hover { transform: translateY(-2px); }
  .ls-question-num { font-size: 22px; margin-bottom: 10px; color: #6D28D9; }
  .ls-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; max-width: 1100px; margin: 20px auto; }
  @media (max-width: 800px) { .ls-options { grid-template-columns: repeat(2, 1fr); } }
  .ls-opt {
    background: white; border: 5px solid #C084FC; border-radius: 24px;
    padding: 20px; text-align: center; cursor: pointer;
    box-shadow: 0 5px 0 #A855F7; transition: all 0.2s;
    min-height: 100px; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
  }
  .ls-opt:hover { transform: translateY(-4px); }
  .ls-opt .zh-big { font-size: 26px; font-weight: bold; color: #5B21B6; }
  .ls-opt.correct { background: #D1FAE5; border-color: #34D399; animation: pop 0.5s; }
  .ls-opt.wrong   { background: #FEE2E2; border-color: #F87171; animation: shake 0.4s; }
  .ls-opt.disabled { pointer-events: none; opacity: 0.6; }
  .ls-score { text-align: center; font-size: 20px; color: #2D1654; margin: 12px 0; }
  .ls-score .badge { background: #34D399; color: white; padding: 3px 16px; border-radius: 50px; font-weight: bold; margin: 0 6px; }
  .ls-score .badge.bad { background: #F87171; }

  /* ===== MC Quiz ===== */
  .mc-card {
    background: white; border: 5px solid #C084FC; border-radius: 24px;
    padding: 28px 20px; text-align: center; margin-bottom: 18px;
    box-shadow: 0 6px 0 #A855F7; max-width: 700px; margin-left: auto; margin-right: auto;
  }
  .mc-word { font-size: 38px; font-weight: bold; color: #5B21B6; margin-bottom: 6px; letter-spacing: 1px; }
  .mc-zh-big { font-size: 32px; font-weight: bold; color: #7C3AED; margin-bottom: 6px; }
  .mc-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 700px; margin: 0 auto 14px; }
  .mc-opt {
    background: white; border: 4px solid #C084FC; border-radius: 18px;
    padding: 18px 12px; font-size: 20px; font-weight: bold;
    color: #2D1654; cursor: pointer; text-align: center;
    box-shadow: 0 4px 0 #A855F7; transition: all 0.15s;
    font-family: inherit; min-height: 66px;
    display: flex; align-items: center; justify-content: center;
  }
  .mc-opt:hover { transform: translateY(-3px); box-shadow: 0 7px 0 #A855F7; }
  .mc-opt.correct { background: #D1FAE5; border-color: #34D399; color: #065F46; pointer-events: none; animation: pop 0.4s; }
  .mc-opt.wrong   { background: #FEE2E2; border-color: #F87171; color: #7F1D1D; pointer-events: none; animation: shake 0.4s; }
  .mc-opt.dim     { opacity: 0.4; pointer-events: none; }
  .mc-progress { text-align: center; font-size: 18px; color: #6D28D9; margin-bottom: 14px; }
  .mc-progress .badge { background: #7C3AED; color: white; padding: 3px 14px; border-radius: 50px; font-weight: bold; margin: 0 5px; }
  .mc-progress .badge.ok { background: #34D399; }
  .mc-progress .badge.bad { background: #F87171; }
  .mc-fb { text-align: center; font-size: 20px; min-height: 28px; margin-bottom: 8px; font-weight: bold; }
  .mc-fb.ok { color: #065F46; }
  .mc-fb.no { color: #B91C1C; }

  @keyframes pop {
    0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); } 75% { transform: translateX(8px); }
  }

  /* ===== Common ===== */
  .reset-row { text-align: center; margin-top: 20px; }
  .reset-btn {
    background: white; color: #7C3AED; border: 3px solid #7C3AED;
    border-radius: 50px; padding: 10px 24px; font-size: 16px;
    font-weight: bold; cursor: pointer; font-family: inherit; margin: 4px;
  }
  .reset-btn:hover { background: #7C3AED; color: white; }
  .all-done {
    text-align: center; background: white; border: 5px solid #C084FC;
    border-radius: 24px; padding: 36px; max-width: 560px;
    margin: 32px auto; box-shadow: 0 6px 0 #A855F7;
  }
  .all-done h2 { font-size: 32px; color: #5B21B6; margin-bottom: 12px; }
  .all-done .big-score { font-size: 72px; color: #7C3AED; margin: 12px 0; font-weight: bold; }
  .all-done .sub-info { font-size: 18px; color: #6D28D9; margin-bottom: 6px; }
  .upload-status { font-size: 15px; color: #6D28D9; margin: 10px 0 16px; min-height: 22px; }

  /* ===== Leaderboard ===== */
  .lb-wrap { max-width: 680px; margin: 0 auto; }
  .lb-level-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .lb-level-btn {
    font-family: inherit; font-size: 17px; font-weight: bold;
    padding: 8px 24px; border: 3px solid #7C3AED; border-radius: 50px;
    background: white; color: #7C3AED; cursor: pointer; transition: all 0.15s;
  }
  .lb-level-btn.active { background: #7C3AED; color: white; }
  .lb-mode-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .lb-tab {
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 10px 4px; border: 2.5px solid #C084FC; border-radius: 12px;
    background: white; color: #7C3AED; cursor: pointer; text-align: center; transition: all 0.15s;
  }
  .lb-tab.active { background: #7C3AED; color: white; border-color: #7C3AED; }
  .lb-empty { text-align: center; color: #6D28D9; padding: 28px 0; font-size: 17px; }
  .lb-row {
    display: flex; align-items: center; background: white;
    border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07); gap: 12px;
  }
  .lb-rank { font-size: 22px; font-weight: 700; width: 34px; text-align: center; flex-shrink: 0; }
  .lb-name { flex: 1; font-size: 17px; font-weight: 600; color: #2D1654; }
  .lb-score-col { text-align: right; }
  .lb-score-main { font-size: 17px; font-weight: 700; color: #5B21B6; }
  .lb-score-sub { font-size: 12px; color: #6D28D9; }
  .lb-loading { text-align: center; color: #6D28D9; padding: 20px; font-size: 16px; }
</style>
</head>
<body>

<!-- Name Screen -->
<div id="nameScreen">
  <div class="ns-box">
    <div class="icon">🧞</div>
    <h1>Aladdin 單字練習</h1>
    <p>第 4 週　輸入名字才能上排行榜！</p>
    <input id="nameInput" type="text" placeholder="你的名字…" maxlength="10"
      onkeyup="if(event.keyCode===13) startApp()">
    <button class="ns-start" onclick="startApp()">開始！</button>
    <button class="ns-lb" onclick="startApp(true)">🏆 先看排行榜</button>
  </div>
</div>

<!-- App -->
<div id="appWrap" style="display:none">
  <header>
    <h1>第 4 週　Aladdin 單字練習</h1>
    <div class="player-bar">玩家：<span id="playerNameDisplay"></span></div>
    <div class="sub" id="word-list-display"></div>
  </header>

  <div class="level-bar">
    <button class="level-btn active" data-level="basic">🧞 基本</button>
    <button class="level-btn" data-level="advanced">✨ 進階</button>
  </div>
  <div class="level-label" id="level-label"></div>

  <nav id="nav">
    <button data-mode="flashcards" class="active">🎴 單字閃卡</button>
    <button data-mode="match">🧩 記憶配對</button>
    <button data-mode="listen">🎧 聽音選詞</button>
    <button data-mode="en2zh">🔤 英選中</button>
    <button data-mode="zh2en">💬 中選英</button>
    <button data-mode="lb" class="lb-btn">🏆 排行榜</button>
  </nav>

  <main id="game"></main>
</div>

<script>
const SUPA_URL = "https://kgyphkpboqiplsqvqsic.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtneXBoa3Bib3FpcGxzcXZxc2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTI4MTUsImV4cCI6MjA5NTQ2ODgxNX0.YIxqzddMYr_CCjlsDgBi1s-NUD_mq8BbRlCj__lqex4";
const WEEK = "W4";

async function dbInsert(data) {
  try {
    await fetch(SUPA_URL + "/rest/v1/score", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + SUPA_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(data)
    });
    return true;
  } catch (e) { return false; }
}

async function dbSelect(modeLabel) {
  const res = await fetch(
    SUPA_URL + "/rest/v1/score?select=*&mode=eq." + encodeURIComponent(modeLabel) +
    "&order=pct.desc,time.asc&limit=20",
    { headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY } }
  );
  if (!res.ok) throw new Error("fetch failed");
  return await res.json();
}

// ===== Word Lists =====
const WORDS_BASIC = [
  { en: 'bad',       zh: '壞的' },
  { en: 'never',     zh: '從不' },
  { en: 'genie',     zh: '精靈' },
  { en: 'wish',      zh: '願望' },
  { en: 'command',   zh: '命令' },
  { en: 'everything',zh: '一切' },
];

const WORDS_ADVANCED = [
  { en: 'magic',    zh: '有魔法的' },
  { en: 'powerful', zh: '強大的' },
  { en: 'big',      zh: '大的' },
  { en: 'helpful',  zh: '熱心的' },
  { en: 'friendly', zh: '友善的' },
  { en: 'loud',     zh: '大聲的' },
  { en: 'scary',    zh: '可怕的' },
  { en: 'cool',     zh: '酷的' },
  { en: 'funny',    zh: '好笑的' },
  { en: 'kind',     zh: '善良的' },
  { en: 'amazing',  zh: '驚人的' },
  { en: 'weird',    zh: '奇怪的' },
];

let playerName = '';
let currentLevel = 'basic';
let WORDS = WORDS_BASIC;
let currentMode = 'flashcards';

// ===== Timer =====
let timerInterval = null;
let timerStart = 0;
let timerElapsed = 0;

function startTimer() {
  stopTimer();
  timerStart = Date.now();
  timerElapsed = 0;
  timerInterval = setInterval(() => {
    timerElapsed = Math.floor((Date.now() - timerStart) / 1000);
    const el = document.getElementById('timerVal');
    if (el) el.textContent = formatTime(timerElapsed);
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerElapsed = Math.floor((Date.now() - timerStart) / 1000);
}
function formatTime(s) {
  const m = Math.floor(s / 60), sc = s % 60;
  return (m > 0 ? m + '分' : '') + sc + '秒';
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function modeLabel(mode) {
  const levelStr = currentLevel === 'basic' ? '基本' : '進階';
  const modeStr = { match: '記憶配對', listen: '聽音選詞', en2zh: '英選中', zh2en: '中選英' }[mode];
  return WEEK + '·' + levelStr + '·' + modeStr;
}

// ===== Speech =====
let englishVoice = null;
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  englishVoice =
    voices.find(v => v.lang === 'en-US' && /samantha|allison|ava|karen/i.test(v.name)) ||
    voices.find(v => v.lang === 'en-US') ||
    voices.find(v => v.lang.startsWith('en'));
}
loadVoices();
if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (englishVoice) u.voice = englishVoice;
    u.lang = 'en-US'; u.rate = 0.75; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ===== Sound FX =====
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, duration, type = 'sine', vol = 0.18) {
  try {
    const ctx = getCtx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    o.stop(ctx.currentTime + duration);
  } catch (e) {}
}
function sfxCorrect() { beep(660, 0.12); setTimeout(() => beep(880, 0.18), 120); }
function sfxWrong()   { beep(220, 0.18, 'square', 0.12); }
function sfxFanfare() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22), i * 130)); }

// ===== Summary + Upload =====
async function renderSummary(mode, score, total, extra) {
  stopTimer();
  const time = timerElapsed;
  const pct = Math.round(score / total * 100);
  const msg = pct >= 90 ? '太厲害了！🎉' : pct >= 70 ? '表現不錯！👍' : '繼續加油！💪';

  const game = document.getElementById('game');
  let scoreDisplay, subInfo;
  if (mode === 'match') {
    const moves = extra;
    scoreDisplay = `<div class="big-score">${moves}<span style="font-size:28px;color:#6D28D9"> 次</span></div>`;
    subInfo = `<div class="sub-info">完成 5 組配對　⏱ ${formatTime(time)}</div>`;
  } else {
    scoreDisplay = `<div class="big-score">${score}<span style="font-size:32px;color:#6D28D9"> / ${total}</span></div>`;
    subInfo = `<div class="sub-info">答對率 ${pct}%　${msg}　⏱ ${formatTime(time)}</div>`;
  }

  game.innerHTML = `
    <div class="all-done">
      <h2>🎉 完成！</h2>
      ${scoreDisplay}
      ${subInfo}
      <div class="upload-status" id="uploadStatus">上傳成績中…</div>
      <button class="reset-btn" onclick="render('${mode}')">再玩一次</button>
      <button class="reset-btn" onclick="showLeaderboard('${mode}')">🏆 看排行榜</button>
      <button class="reset-btn" onclick="render('flashcards')">回閃卡</button>
    </div>
  `;
  sfxFanfare();

  let uploadData;
  if (mode === 'match') {
    const moves = extra;
    const effPct = Math.round(500 / moves);
    uploadData = { name: playerName, score: 5, total: moves, pct: effPct, time, mode: modeLabel(mode), created_at: new Date().toISOString() };
  } else {
    uploadData = { name: playerName, score, total, pct, time, mode: modeLabel(mode), created_at: new Date().toISOString() };
  }
  const ok = await dbInsert(uploadData);
  const statusEl = document.getElementById('uploadStatus');
  if (statusEl) statusEl.textContent = ok ? '✓ 成績已上傳！' : '（上傳失敗，請檢查網路）';
}

// ===== Name Screen =====
window.startApp = function(goLb = false) {
  const el = document.getElementById('nameInput');
  const name = el ? el.value.trim() : '';
  if (!name) { if (el) { el.style.borderColor = '#F87171'; el.focus(); } return; }
  playerName = name;
  document.getElementById('nameScreen').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  document.getElementById('playerNameDisplay').textContent = name;
  updateWordListDisplay();
  if (goLb) showLeaderboard();
  else render('flashcards');
};

// ===== Level Selector =====
function updateWordListDisplay() {
  const display = document.getElementById('word-list-display');
  const label = document.getElementById('level-label');
  display.textContent = WORDS.map(w => w.en + '（' + w.zh + '）').join('　');
  label.textContent = currentLevel === 'basic'
    ? '基本單字：6 個（p.12–17 故事用詞）'
    : '進階單字：12 個（描述精靈的形容詞）';
}
document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLevel = btn.dataset.level;
    WORDS = currentLevel === 'basic' ? WORDS_BASIC : WORDS_ADVANCED;
    updateWordListDisplay();
    render(currentMode);
  });
});

// ===== Mode Switcher =====
const game = document.getElementById('game');
const navButtons = document.querySelectorAll('#nav button');
navButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    navButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    render(currentMode);
  });
});

function render(mode) {
  currentMode = mode;
  navButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (mode === 'flashcards') renderFlashcards();
  else if (mode === 'match') renderMatch();
  else if (mode === 'listen') renderListen();
  else if (mode === 'en2zh') renderMC('en2zh');
  else if (mode === 'zh2en') renderMC('zh2en');
  else if (mode === 'lb') showLeaderboard();
}

// ===== Mode 1: Flashcards =====
function renderFlashcards() {
  stopTimer();
  game.innerHTML = `
    <div class="panel-title">🎴 單字閃卡
      <small>點卡片翻面 / 點 🔊 聽發音</small>
    </div>
    <div class="fc-grid" id="fc-grid"></div>
    <div class="reset-row">
      <button class="reset-btn" id="fc-hideall">🙈 隱藏全部英文</button>
      <button class="reset-btn" id="fc-showall">👀 顯示全部英文</button>
      <button class="reset-btn" id="fc-speakall">🔊 全部唸一次</button>
    </div>
  `;
  const grid = document.getElementById('fc-grid');
  WORDS.forEach(w => {
    const card = document.createElement('div');
    card.className = 'fc-card';
    card.innerHTML = `
      <div class="fc-zh-front">${w.zh}</div>
      <div class="fc-word fc-word-hidden" style="display:none">${w.en}</div>
      <div class="fc-hint">點卡片看英文</div>
      <div><button class="fc-speak" data-en="${w.en}">🔊 聽發音</button></div>
    `;
    card.addEventListener('click', e => {
      if (e.target.classList.contains('fc-speak')) return;
      card.classList.toggle('flipped');
      const f = card.classList.contains('flipped');
      card.querySelector('.fc-word-hidden').style.display = f ? 'block' : 'none';
      card.querySelector('.fc-hint').textContent = f ? w.en : '點卡片看英文';
      card.querySelector('.fc-hint').style.display = f ? 'none' : 'block';
    });
    grid.appendChild(card);
  });
  document.querySelectorAll('.fc-speak').forEach(btn =>
    btn.addEventListener('click', e => { e.stopPropagation(); speak(btn.dataset.en); })
  );
  document.getElementById('fc-hideall').addEventListener('click', () => {
    document.querySelectorAll('.fc-card').forEach(c => {
      c.classList.remove('flipped');
      const hw = c.querySelector('.fc-word-hidden');
      const hint = c.querySelector('.fc-hint');
      if (hw) hw.style.display = 'none';
      // restore hint text
      const zh = c.querySelector('.fc-zh-front').textContent;
      if (hint) { hint.textContent = '點卡片看英文'; hint.style.display = 'block'; }
    });
  });
  document.getElementById('fc-showall').addEventListener('click', () => {
    document.querySelectorAll('.fc-card').forEach(c => {
      c.classList.add('flipped');
      const hw = c.querySelector('.fc-word-hidden');
      const hint = c.querySelector('.fc-hint');
      if (hw) hw.style.display = 'block';
      if (hint) hint.style.display = 'none';
    });
  });
  document.getElementById('fc-speakall').addEventListener('click', async () => {
    for (let i = 0; i < WORDS.length; i++) {
      speak(WORDS[i].en);
      await new Promise(r => setTimeout(r, 1600));
    }
  });
}

// ===== Mode 2: Memory Match (5 words per round) =====
let mmState = null;
function renderMatch() {
  const n = Math.min(5, WORDS.length);
  const picked = shuffle(WORDS).slice(0, n);
  const pairs = [];
  picked.forEach((w, i) => {
    pairs.push({ id: i, type: 'en', w });
    pairs.push({ id: i, type: 'zh', w });
  });
  mmState = { cards: shuffle(pairs), picked, flipped: [], matched: new Set(), moves: 0 };
  startTimer();
  drawMatch();
}
function drawMatch() {
  const total = mmState.picked.length;
  const matched = mmState.matched.size;
  game.innerHTML = `
    <div class="panel-title">🧩 記憶配對
      <small>翻開兩張卡，配對「英文單字 ↔ 中文意思」</small>
    </div>
    <div class="mm-status">
      已配對 <span class="badge">${matched} / ${total}</span>
      嘗試次數 <span class="badge">${mmState.moves}</span>
    </div>
    <div class="game-timer">⏱ <span id="timerVal">${formatTime(timerElapsed)}</span></div>
    <div class="mm-grid" id="mm-grid"></div>
    <div class="reset-row">
      <button class="reset-btn" id="mm-reset">🔄 重新開始（同一組）</button>
      <button class="reset-btn" id="mm-new">🎲 換一組</button>
    </div>
  `;
  const grid = document.getElementById('mm-grid');
  mmState.cards.forEach((c, idx) => {
    const el = document.createElement('div');
    el.className = 'mm-card';
    if (mmState.flipped.includes(idx)) el.classList.add('flipped');
    if (mmState.matched.has(c.id)) el.classList.add('matched');
    el.innerHTML = c.type === 'en'
      ? `<div class="mm-content"><div class="wd">${c.w.en}</div></div>`
      : `<div class="mm-content"><div class="z">${c.w.zh}</div></div>`;
    el.addEventListener('click', () => handleMatchClick(idx));
    grid.appendChild(el);
  });
  document.getElementById('mm-reset').addEventListener('click', () => {
    const picked = mmState.picked;
    const pairs = [];
    picked.forEach((w, i) => {
      pairs.push({ id: i, type: 'en', w });
      pairs.push({ id: i, type: 'zh', w });
    });
    mmState = { cards: shuffle(pairs), picked, flipped: [], matched: new Set(), moves: 0 };
    startTimer();
    drawMatch();
  });
  document.getElementById('mm-new').addEventListener('click', renderMatch);

  if (matched === total && total > 0) {
    const finalMoves = mmState.moves;
    setTimeout(() => renderSummary('match', total, total, finalMoves), 600);
  }
}
function handleMatchClick(idx) {
  if (mmState.flipped.length >= 2) return;
  if (mmState.flipped.includes(idx)) return;
  if (mmState.matched.has(mmState.cards[idx].id)) return;
  mmState.flipped.push(idx);
  if (mmState.flipped.length === 2) {
    mmState.moves++;
    const [a, b] = mmState.flipped;
    const cA = mmState.cards[a], cB = mmState.cards[b];
    if (cA.id === cB.id) {
      setTimeout(() => {
        mmState.matched.add(cA.id);
        mmState.flipped = [];
        sfxCorrect(); speak(cA.w.en);
        drawMatch();
      }, 600);
    } else {
      setTimeout(() => { mmState.flipped = []; sfxWrong(); drawMatch(); }, 1100);
    }
  }
  drawMatch();
}

// ===== Mode 3: Listen and Choose (Chinese options) =====
let lsState = null;
function renderListen() {
  lsState = { qList: shuffle([...WORDS, ...WORDS]), qIndex: 0, correct: 0, wrong: 0, locked: false };
  startTimer();
  drawListen();
}
function drawListen() {
  const total = lsState.qList.length;
  if (lsState.qIndex >= total) { renderSummary('listen', lsState.correct, total, null); return; }
  const cur = lsState.qList[lsState.qIndex];
  const others = WORDS.filter(w => w.en !== cur.en);
  const options = shuffle([cur, ...shuffle(others).slice(0, 3)]);

  game.innerHTML = `
    <div class="panel-title">🎧 聽音選詞<small>聽英文，選正確的中文意思</small></div>
    <div class="ls-question-num">第 ${lsState.qIndex + 1} / ${total} 題</div>
    <div class="game-timer">⏱ <span id="timerVal">${formatTime(timerElapsed)}</span></div>
    <div class="ls-prompt"><button class="ls-play-btn" id="ls-play">🔊 再聽一次</button></div>
    <div class="ls-score">
      答對 <span class="badge">${lsState.correct}</span>
      答錯 <span class="badge bad">${lsState.wrong}</span>
    </div>
    <div class="ls-options" id="ls-options"></div>
    <div class="reset-row"><button class="reset-btn" onclick="renderListen()">🔄 重新開始</button></div>
  `;
  const optBox = document.getElementById('ls-options');
  options.forEach(opt => {
    const el = document.createElement('div');
    el.className = 'ls-opt';
    el.innerHTML = `<div class="zh-big">${opt.zh}</div>`;
    el.addEventListener('click', () => handleListenClick(el, opt, cur));
    optBox.appendChild(el);
  });
  document.getElementById('ls-play').addEventListener('click', () => speak(cur.en));
  setTimeout(() => speak(cur.en), 400);
  lsState.locked = false;
}
function handleListenClick(el, picked, correct) {
  if (lsState.locked) return;
  lsState.locked = true;
  document.querySelectorAll('.ls-opt').forEach(o => o.classList.add('disabled'));
  if (picked.en === correct.en) {
    el.classList.add('correct'); sfxCorrect(); lsState.correct++;
  } else {
    el.classList.add('wrong'); sfxWrong(); lsState.wrong++;
    document.querySelectorAll('.ls-opt').forEach(o => {
      if (o.querySelector('.zh-big').textContent === correct.zh) o.classList.add('correct');
    });
  }
  setTimeout(() => { lsState.qIndex++; drawListen(); }, 1400);
}

// ===== Mode 4 & 5: MC Quiz =====
let mcState = null;
function renderMC(direction) {
  mcState = { direction, qList: shuffle([...WORDS, ...WORDS]), qIndex: 0, correct: 0, wrong: 0, locked: false };
  startTimer();
  drawMC();
}
function drawMC() {
  const { direction, qList, qIndex, correct, wrong } = mcState;
  const total = qList.length;
  if (qIndex >= total) { renderSummary(direction, correct, total, null); return; }
  const cur = qList[qIndex];
  const others = WORDS.filter(w => w.en !== cur.en);
  const options = shuffle([cur, ...shuffle(others).slice(0, 3)]);
  const title = direction === 'en2zh' ? '🔤 英選中' : '💬 中選英';
  const sub = direction === 'en2zh' ? '看英文，選中文意思' : '看中文，選英文單字';
  const promptHTML = direction === 'en2zh'
    ? `<div class="mc-word">${cur.en}</div>`
    : `<div class="mc-zh-big">${cur.zh}</div>`;
  const optsHTML = options.map(opt => {
    const label = direction === 'en2zh' ? opt.zh : opt.en;
    const val = (direction === 'en2zh' ? opt.zh : opt.en).replace(/'/g, "\\'");
    const corr = (direction === 'en2zh' ? cur.zh : cur.en).replace(/'/g, "\\'");
    return `<button class="mc-opt" onclick="handleMCClick(this,'${val}','${corr}','${cur.en}')">${label}</button>`;
  }).join('');

  game.innerHTML = `
    <div class="panel-title">${title}<small>${sub}</small></div>
    <div class="mc-progress">
      第 ${qIndex + 1} / ${total} 題
      答對 <span class="badge ok">${correct}</span>
      答錯 <span class="badge bad">${wrong}</span>
    </div>
    <div class="game-timer">⏱ <span id="timerVal">${formatTime(timerElapsed)}</span></div>
    <div class="mc-card" style="margin-bottom:18px">${promptHTML}</div>
    <div class="mc-opts">${optsHTML}</div>
    <div class="mc-fb" id="mc-fb"></div>
    <div class="reset-row">
      <button class="reset-btn" onclick="renderMC('${direction}')">🔄 重新開始</button>
    </div>
  `;
  if (direction === 'en2zh') setTimeout(() => speak(cur.en), 300);
  mcState.locked = false;
}
window.handleMCClick = function(el, chosen, correct, enWord) {
  if (mcState.locked) return;
  mcState.locked = true;
  document.querySelectorAll('.mc-opt').forEach(o => {
    if (o.textContent.trim() === correct) o.classList.add('correct');
    else if (o.textContent.trim() === chosen && chosen !== correct) o.classList.add('wrong');
    else o.classList.add('dim');
  });
  const fb = document.getElementById('mc-fb');
  if (chosen === correct) {
    sfxCorrect(); speak(enWord);
    fb.textContent = '✓ 答對了！'; fb.className = 'mc-fb ok';
    mcState.correct++;
    setTimeout(() => { mcState.qIndex++; drawMC(); }, 900);
  } else {
    sfxWrong();
    fb.textContent = `✗ 正確答案是「${correct}」`; fb.className = 'mc-fb no';
    mcState.wrong++;
    setTimeout(() => { mcState.qIndex++; drawMC(); }, 1700);
  }
};

// ===== Leaderboard =====
let lbLevel = 'basic';
let lbMode = 'listen';
const LB_MODES = ['listen', 'en2zh', 'zh2en', 'match'];
const LB_MODE_NAMES = { listen: '聽音選詞', en2zh: '英選中', zh2en: '中選英', match: '記憶配對' };

function showLeaderboard(initMode) {
  stopTimer();
  if (initMode && LB_MODES.includes(initMode)) lbMode = initMode;
  if (initMode) lbLevel = currentLevel;
  currentMode = 'lb';
  navButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === 'lb'));

  const levelBtns = ['basic', 'advanced'].map(l =>
    `<button class="lb-level-btn${lbLevel===l?' active':''}" onclick="switchLbLevel('${l}')">${l==='basic'?'🧞 基本':'✨ 進階'}</button>`
  ).join('');
  const modeTabs = LB_MODES.map(m =>
    `<button class="lb-tab${lbMode===m?' active':''}" onclick="switchLbTab('${m}')">${LB_MODE_NAMES[m]}</button>`
  ).join('');

  game.innerHTML = `
    <div class="lb-wrap">
      <div class="panel-title">🏆 排行榜　<small>第 4 週</small></div>
      <div class="lb-level-bar">${levelBtns}</div>
      <div class="lb-mode-tabs">${modeTabs}</div>
      <div id="lbList"><div class="lb-loading">載入中…</div></div>
      <div class="reset-row">
        <button class="reset-btn" onclick="render('flashcards')">← 回遊戲</button>
      </div>
    </div>
  `;
  loadLbData();
}
window.switchLbLevel = function(l) { lbLevel = l; showLeaderboard(); };
window.switchLbTab = function(m) { lbMode = m; showLeaderboard(); };

async function loadLbData() {
  const lbList = document.getElementById('lbList');
  if (!lbList) return;
  const label = WEEK + '·' + (lbLevel === 'basic' ? '基本' : '進階') + '·' + LB_MODE_NAMES[lbMode];
  try {
    const rows = await dbSelect(label);
    if (!rows || rows.length === 0) {
      lbList.innerHTML = '<div class="lb-empty">還沒有人上榜，快來第一個！</div>';
      return;
    }
    const medals = ['🥇', '🥈', '🥉'];
    const isMatch = lbMode === 'match';
    let html = '';
    rows.forEach((d, i) => {
      const rank = i < 3 ? medals[i] : (i + 1);
      const mainScore = isMatch ? `${d.total} 次` : `${d.score}/${d.total} (${d.pct}%)`;
      html += `
        <div class="lb-row">
          <div class="lb-rank">${rank}</div>
          <div class="lb-name">${d.name}</div>
          <div class="lb-score-col">
            <div class="lb-score-main">${mainScore}</div>
            <div class="lb-score-sub">⏱ ${formatTime(d.time)}</div>
          </div>
        </div>`;
    });
    lbList.innerHTML = html;
  } catch (e) {
    lbList.innerHTML = '<div class="lb-empty">載入失敗，請檢查網路</div>';
  }
}
